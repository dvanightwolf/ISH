{% extends "home/home.html" %}
{% block content %}
    {% load static %}
    <!DOCTYPE html>
    <html lang="en" >
    <head>
      <meta charset="UTF-8">
      <title>صوفية القرآن - معرض الصور</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <style>
        .card_image {
            transition: transform 0.3s ease-in-out;
        }
        .card_image:hover,
        .card_price:hover ~ .card_image {
            transform: scale(1.02);
        }
    </style>
    </head>
    <body>
      <br>
      <br>
      <br>
      <br>
      <br>
      <div class="gallery">
        <ul class="grid">
            {% for photo in photos %}
            <li class="grid-item">
                <div class="card" style="border: none;">
                    <div class="card_image" onclick="showPhotoPopup('{{ photo.photo.url }}')">
                        <img src="{{ photo.photo.url }}" alt="{{ photo.title }}">
                        <div class="hover-text">{{ photo.title }}</div>
                    </div>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
       


<!-- Video Popup -->
<div id="photoPopup" class="popup">
    <div class="popup-content">
        <span class="close-btn" onclick="closePhotoPopup()">&times;</span>
        <img id="imageFrame" src="" alt="Popup Image">
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var grid = document.querySelector('.grid');
        var msnry = new Masonry(grid, {
            itemSelector: '.grid-item',
            columnWidth: '.grid-item',
            percentPosition: true
        });
    });
    </script>
    
<!-- CSS -->
<style>
    .hover-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--main-color);
        font-size: 20px;
        font-weight: bold;
        border-radius: 3%;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        z-index: 2;
    }
    
    .card_image:hover .hover-text {
        opacity: 1;
    }

    .grid {
        display: flex;
        flex-wrap: wrap;
        margin: 0px;
    }
    
    .grid-item {
        width: calc(20% - 15px); /* Adjust columns */
        margin: 5px;
    }

    /* Medium screens (1000px and below) - 4 columns */
    @media (max-width: 1000px) {
        .grid-item {
            width: calc(25% - 15px);
            margin: 5px;
        }
    }

    /* Small screens (780px and below) - 2 columns */
    @media (max-width: 780px) {
        .grid-item {
            width: calc(50% - 10px);
            margin: 5px;
        }
    }

    /* Mobile screens (480px and below) - 1 column */
    @media (max-width: 480px) {
        .grid-item {
            width: 100%;
            margin: 5px 0;
        }
    }

    .grid-item img {
        width: 100%;
        height: auto;
        border-radius: 2%;
        display: block;
    }
    
    /* Popup styles */
    .popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 6.5%;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index:2;
    }

    .popup-content {
        background: var(--main-color);
        padding: 20px;
        border-radius: 10px;
        position: relative;
        text-align: center;
        z-index: 10000; /* Ensures content is above popup background */
    }

    .popup img {
        max-width: 100%;
        max-height: 75vh;
        border-radius: 5px;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
    }
    .card_image::after {
        content: "";
        position: absolute;
        border-radius: 2%;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--secondary-color); /* Green overlay with 40% opacity */
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }
    
    .card_image:hover::after {
        opacity: 0.6; /* Show the overlay on hover */
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .popup-content {
            max-width: 95%;
            max-height: 85%;
        }
    }

    .play-button {
    z-index: 1;
    display: inline-flex;
    justify-self: anchor-center;
    margin-left: 5%;
    margin-top: 20%;
    position: absolute;
    justify-content: center;
    align-items: center;
    width: 16%;
    height: 15%;
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border-radius: 50%; /* Circular shape */
    font-size: 24px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

/* Hover effect */
.play-button:hover {
    background-color: rgba(0, 0, 0, 0.7); /* Darker black on hover */
}
</style>

<!-- JavaScript -->
<script>
// Close popup when clicking outside content
document.getElementById("photoPopup").addEventListener('click', function(event) {
    if (event.target === this) { // Ensures only clicking on the background closes the popup
        closePhotoPopup();
    }
});
function showPhotoPopup(imgurl) {
    if (imgurl) {
        document.getElementById("imageFrame").src = imgurl;
        document.getElementById("photoPopup").style.display = "flex";
    }
}

function closePhotoPopup() {
    document.getElementById("photoPopup").style.display = "none";
    document.getElementById("imageFrame").src = "";
}

</script>

<br>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>
</body>
</html>
{% endblock content %}
