{% extends "home/home.html" %}
{% block content %}
    {% load static %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>صوفية القرآن - مقاطع الفيديو</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
      <style>
          .main.container {
              padding: 150px 0px 50px 0px;
          }
          .cards {
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 20px;
              align-items: start;
              justify-content: center;
              max-width: 90%;
              margin: auto;
          }
          .cards_item {
              display: flex;
              flex-direction: row;
              align-items: center;
              background: rgba(255, 255, 255, 0.950) !important;
              color: white;
              border-radius: 10px;
              overflow: hidden;
              width: 100%;
              max-width: 600px;
              box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
          }
          .card_image img {
              width: 200px;
              height: 200px;
              object-fit: cover;
          }
          .card_content {
              flex: 1;
              padding: 20px;
          }
          .card_title {
              font-size: 42px;
              margin-bottom: 10px;
          }
          .card_text p {
              font-size: 16px;
              color: var(--secondary-color);
              opacity: 0.7;
          }
      </style>
    </head>
    <body>
        <div class="main container">
            <ul class="cards">
                {% for article in articles %}
                <li class="cards_item">
                    <div class="card_image">
                        <img src="{{ article.photo.url }}" alt="{{ article.title }}">
                    </div>
                    <div class="card_content">
                        <h2 class="card_title" style="color: var(--secondary-color);">{{ article.title }}</h2>
                        <div class="card_text">
                            {% if article.category %}
                                <p><em>{{ article.category }}</em></p>
                            {% endif %}
                        </div>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </body>
    </html>
{% endblock content %}
